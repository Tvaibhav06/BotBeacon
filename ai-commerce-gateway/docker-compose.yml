services:
  postgres:
    image: postgres:16-alpine
    container_name: acg_postgres
    environment:
      POSTGRES_USER: acg_user
      POSTGRES_PASSWORD: acg_pass
      POSTGRES_DB: ai_commerce_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acg_user -d ai_commerce_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acg_backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
      - "8100:8100"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://acg_user:acg_pass@postgres:5432/ai_commerce_gateway
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8100"
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
      - ./buyer-client:/buyer-client
    working_dir: /app
    command: >
      sh -c "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acg_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000

volumes:
  postgres_data:
